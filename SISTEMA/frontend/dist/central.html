<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Central de Comando · Nogueira &amp; Tovani</title>
<link rel="icon" type="image/png" href="/logo-nt.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Central de Comando do escritorio (13/11/2026).
  Pagina avulsa servida de dist/ (nginx: try_files). Usa o mesmo login do
  sistema (localStorage esc_token). Le:
    /api/dashboard/central        agregado (CRM, processos, clientes, portal...)
    /api/dashboard/resumo         CRM do WhatsApp
    /api/controladoria/*          intimacoes, prazos e carteira vindos do SYNC
    /api/campanhas/*              Meta Ads
    /api/tarefas/resumo, /api/audiencias, /api/fin/resumo, /api/rh/resumo,
    /api/cadastro/resumo, /api/sistema/modulos
  Cada bloco e independente: sem permissao ou fora do ar, o cartao avisa e o
  resto da tela segue.
  Identidade: vermelho #BB0F18 + cinza #7d8996 (timbrado Nogueira & Tovani).
-->
<style>
:root{
  color-scheme: light;
  --marca:#BB0F18; --marca-forte:#9a0c14; --marca-suave:rgba(187,15,24,.08); --marca-linha:rgba(187,15,24,.28);
  --cinza-marca:#7d8996;
  --bg:#f4f1f0; --bg-2:#ebe6e4; --sup:#ffffff; --sup-2:#fbf9f8; --sup-3:#f7f4f3;
  --linha:#e3dfdd; --linha-forte:#cfc8c5;
  --tx:#1d2127; --tx-2:#5d6672; --tx-3:#8a929c;
  --serie-1:#BB0F18; --serie-2:#b3bcc7; --barra-fundo:#efebe9;
  --ok:#15803d; --ok-bg:rgba(21,128,61,.10);
  --alerta:#b45309; --alerta-bg:rgba(180,83,9,.10);
  --critico:#BB0F18; --critico-bg:rgba(187,15,24,.09);
  --grid:rgba(29,33,39,.07);
  --sombra:0 1px 2px rgba(29,33,39,.04),0 8px 24px rgba(29,33,39,.05);
  --side-bg:#16191e; --side-tx:#c9cfd6; --side-tx-2:#8b949e; --side-linha:rgba(255,255,255,.07); --side-ativo:rgba(239,75,82,.14);
  --brilho:transparent;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --marca:#ef4b52; --marca-forte:#ff6a70; --marca-suave:rgba(239,75,82,.10); --marca-linha:rgba(239,75,82,.35);
    --cinza-marca:#9aa4b2;
    --bg:#0c0e12; --bg-2:#101318; --sup:#14171c; --sup-2:#171b21; --sup-3:#1b2027;
    --linha:#232932; --linha-forte:#2f3742;
    --tx:#eef1f4; --tx-2:#a7b0bb; --tx-3:#6f7984;
    --serie-1:#ef4b52; --serie-2:#cfd6df; --barra-fundo:#1f252d;
    --ok:#3ecf8e; --ok-bg:rgba(62,207,142,.12);
    --alerta:#f0b429; --alerta-bg:rgba(240,180,41,.12);
    --critico:#ef4b52; --critico-bg:rgba(239,75,82,.13);
    --grid:rgba(255,255,255,.06);
    --sombra:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
    --side-bg:#0f1216; --side-tx:#c9cfd6; --side-tx-2:#7d8692; --side-linha:rgba(255,255,255,.06); --side-ativo:rgba(239,75,82,.14);
    --brilho:rgba(239,75,82,.07);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --marca:#ef4b52; --marca-forte:#ff6a70; --marca-suave:rgba(239,75,82,.10); --marca-linha:rgba(239,75,82,.35);
  --cinza-marca:#9aa4b2;
  --bg:#0c0e12; --bg-2:#101318; --sup:#14171c; --sup-2:#171b21; --sup-3:#1b2027;
  --linha:#232932; --linha-forte:#2f3742;
  --tx:#eef1f4; --tx-2:#a7b0bb; --tx-3:#6f7984;
  --serie-1:#ef4b52; --serie-2:#cfd6df; --barra-fundo:#1f252d;
  --ok:#3ecf8e; --ok-bg:rgba(62,207,142,.12);
  --alerta:#f0b429; --alerta-bg:rgba(240,180,41,.12);
  --critico:#ef4b52; --critico-bg:rgba(239,75,82,.13);
  --grid:rgba(255,255,255,.06);
  --sombra:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
  --side-bg:#0f1216; --side-tx:#c9cfd6; --side-tx-2:#7d8692; --side-linha:rgba(255,255,255,.06); --side-ativo:rgba(239,75,82,.14);
  --brilho:rgba(239,75,82,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--marca);outline-offset:2px;border-radius:6px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.app.recolhida{grid-template-columns:72px minmax(0,1fr)}
aside.side{position:sticky;top:0;height:100vh;background:var(--side-bg);color:var(--side-tx);display:flex;flex-direction:column;border-right:1px solid var(--side-linha);overflow:hidden;z-index:20}
aside.side::before{content:"";position:absolute;inset:0 0 auto 0;height:220px;background:radial-gradient(120% 90% at 0% 0%,rgba(239,75,82,.18),transparent 60%);pointer-events:none}
.marca{position:relative;padding:22px 20px 18px;display:flex;align-items:center;gap:10px;min-height:86px}
.marca canvas{width:186px;height:auto;display:block}
.marca .simbolo{display:none;width:32px;height:32px}
.recolhida .marca canvas{display:none}
.recolhida .marca .simbolo{display:block}
.side-rot{font-size:11px;letter-spacing:.06em;color:var(--side-tx-2);padding:14px 22px 6px;font-weight:600}
.recolhida .side-rot{visibility:hidden;height:10px;padding:4px}
nav.menu{flex:1;overflow-y:auto;padding:4px 12px 12px;scrollbar-width:thin}
nav.menu button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--side-tx);font-size:13.5px;font-weight:500;position:relative;transition:background .15s,color .15s}
nav.menu button:hover{background:rgba(255,255,255,.04);color:#fff}
nav.menu button.on{background:var(--side-ativo);color:#fff}
nav.menu button.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#ef4b52;box-shadow:0 0 12px #ef4b52}
nav.menu svg{width:18px;height:18px;flex:none;opacity:.9}
nav.menu .rot{flex:1;white-space:nowrap}
nav.menu .cnt{font:600 11px/1 "JetBrains Mono",monospace;padding:4px 7px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--side-tx)}
nav.menu .cnt.quente{background:rgba(239,75,82,.22);color:#ffb3b6}
nav.menu kbd{font:500 10px "JetBrains Mono",monospace;color:var(--side-tx-2);border:1px solid var(--side-linha);border-radius:4px;padding:1px 5px}
.recolhida nav.menu .rot,.recolhida nav.menu .cnt,.recolhida nav.menu kbd{display:none}
.recolhida nav.menu button{justify-content:center}
.side-pe{border-top:1px solid var(--side-linha);padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--side-tx-2)}
.side-pe .linha{display:flex;align-items:center;gap:8px}
.pulso{width:8px;height:8px;border-radius:50%;background:#3ecf8e;box-shadow:0 0 0 0 rgba(62,207,142,.6);animation:pulso 2s infinite;flex:none}
.pulso.off{background:#6f7984;animation:none}
.pulso.erro{background:#ef4b52;animation:none}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(62,207,142,.55)}70%{box-shadow:0 0 0 7px rgba(62,207,142,0)}100%{box-shadow:0 0 0 0 rgba(62,207,142,0)}}
.side-pe .usuario{display:flex;align-items:center;gap:10px;color:var(--side-tx)}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#BB0F18,#5a070c);display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.recolhida .side-pe .txt{display:none}
.side-btns{display:flex;gap:6px}
.side-btns button{all:unset;cursor:pointer;flex:1;text-align:center;padding:7px;border:1px solid var(--side-linha);border-radius:8px;color:var(--side-tx);font-size:12px}
.side-btns button:hover{background:rgba(255,255,255,.05)}
.recolhida .side-btns{flex-direction:column}

main{min-width:0;position:relative}
main::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 40% at 80% -10%,var(--brilho),transparent 70%);z-index:0}
.topo{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:16px 32px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--linha)}
.topo h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.topo .sub{color:var(--tx-2);font-size:12.5px}
.topo .esp{flex:1}
.relogio{font:500 13px "JetBrains Mono",monospace;color:var(--tx-2)}
.ao-vivo{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--ok);background:var(--ok-bg);padding:5px 10px;border-radius:20px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--linha-forte);background:var(--sup);color:var(--tx);padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:600;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--marca-linha)}
.btn svg{width:15px;height:15px}
.btn.girando svg{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.menu-mob{display:none}
.conteudo{position:relative;z-index:1;padding:24px 32px 64px;max-width:1600px}

/* ---------- blocos ---------- */
.grade{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.g-kpi.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1180px){.g-kpi.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.sec{margin-top:16px}
.cartao{background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:18px 20px;box-shadow:var(--sombra);min-width:0;position:relative}
.cartao h3{margin:0;font-size:14px;font-weight:650;letter-spacing:-.005em}
.cartao .cab{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cartao .cab .desc{color:var(--tx-3);font-size:12px}
.cartao .cab .esp{flex:1}
.kpi{padding:16px 18px;overflow:hidden;cursor:default}
.kpi.clic{cursor:pointer;transition:transform .15s,border-color .15s}
.kpi.clic:hover{transform:translateY(-2px);border-color:var(--marca-linha)}
.kpi .rot{color:var(--tx-2);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:clamp(21px,1.75vw,28px);font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val small{font-size:14px;font-weight:600;color:var(--tx-2);margin-left:2px}
.kpi .det{color:var(--tx-3);font-size:12px;margin-top:6px;min-height:18px}
.kpi .spark{display:block;width:100%;height:26px;margin-top:8px;opacity:.9}
.kpi.destaque{background:linear-gradient(160deg,var(--marca-suave),transparent 60%),var(--sup);border-color:var(--marca-linha)}
.kpi.destaque .val{color:var(--marca)}
.delta{font:600 11.5px "JetBrains Mono",monospace;padding:2px 6px;border-radius:5px}
.delta.sobe{color:var(--ok);background:var(--ok-bg)}
.delta.desce{color:var(--critico);background:var(--critico-bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--linha-forte);background:transparent;padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600;color:var(--tx-2)}
.chip:hover{color:var(--tx)}
.chip.on{background:var(--marca);border-color:var(--marca);color:#fff}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap;background:var(--sup-3);color:var(--tx-2)}
.tag.critico{background:var(--critico-bg);color:var(--critico)}
.tag.alerta{background:var(--alerta-bg);color:var(--alerta)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.marca{background:var(--marca-suave);color:var(--marca)}
.tag svg{width:12px;height:12px}
.vazio{color:var(--tx-3);font-size:13px;padding:18px 4px;text-align:center}
.aviso{display:flex;gap:10px;align-items:flex-start;background:var(--alerta-bg);color:var(--tx);border:1px solid color-mix(in srgb,var(--alerta) 35%,transparent);border-radius:10px;padding:10px 12px;font-size:12.5px}
.aviso svg{width:16px;height:16px;color:var(--alerta);flex:none;margin-top:2px}
.bloqueado{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 10px;color:var(--tx-3);font-size:12.5px;text-align:center}
.bloqueado svg{width:22px;height:22px}
.esqueleto{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--sup-3),var(--bg-2),var(--sup-3));background-size:300% 100%;animation:brilho 1.4s ease infinite}
@keyframes brilho{0%{background-position:100% 0}100%{background-position:0 0}}

/* barras horizontais */
.hb{display:flex;flex-direction:column;gap:9px}
.hb-l{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:12.5px;border-radius:6px;padding:2px 4px;margin:0 -4px}
.hb-l:hover{background:var(--sup-3)}
.hb-l .n{color:var(--tx-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-l .v{font-weight:600}
.hb-l .tr{grid-column:1/-1;height:6px;border-radius:4px;background:var(--barra-fundo);overflow:hidden}
.hb-l .tr i{display:block;height:100%;border-radius:4px;background:var(--serie-1);transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* tabela */
.tabela-wrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table.t{width:100%;border-collapse:collapse;font-size:12.8px}
table.t th{text-align:left;font-weight:600;color:var(--tx-3);font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--linha);white-space:nowrap;cursor:pointer;user-select:none}
table.t th.d,table.t td.d{text-align:right}
table.t td{padding:10px;border-bottom:1px solid var(--linha);vertical-align:top}
table.t tr:last-child td{border-bottom:none}
table.t tbody tr{transition:background .12s}
table.t tbody tr.clic{cursor:pointer}
table.t tbody tr:hover{background:var(--sup-3)}
.cl{max-width:420px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--tx-2);font-size:12px;margin-top:2px}

/* busca */
.busca{display:flex;align-items:center;gap:8px;border:1px solid var(--linha-forte);border-radius:9px;padding:6px 10px;background:var(--sup-2);min-width:220px}
.busca svg{width:15px;height:15px;color:var(--tx-3)}
.busca input{all:unset;flex:1;font-size:13px;color:var(--tx)}

/* graficos */
.graf{position:relative;width:100%}
.graf svg{display:block;width:100%;overflow:visible}
.graf .eixo{fill:var(--tx-3);font:11px Inter,sans-serif}
.graf .grade-l{stroke:var(--grid);stroke-width:1}
.legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--tx-2)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legenda i.tracejado{background:repeating-linear-gradient(90deg,var(--serie-2) 0 4px,transparent 4px 7px)!important}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--sup);border:1px solid var(--linha-forte);border-radius:10px;padding:8px 11px;font-size:12px;box-shadow:0 12px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;min-width:120px}
#tip.on{opacity:1;transform:none}
#tip b{display:block;font-size:11.5px;color:var(--tx-2);font-weight:600;margin-bottom:4px}
#tip .l{display:flex;align-items:center;gap:7px;justify-content:space-between}
#tip .l i{width:8px;height:8px;border-radius:2px;display:inline-block}

/* medidor */
.medidor{height:10px;border-radius:6px;background:var(--barra-fundo);position:relative;overflow:visible;margin:12px 0 6px}
.medidor .ench{height:100%;border-radius:6px;background:var(--serie-1);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.medidor .marco{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--tx)}
.medidor-leg{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx-3)}

/* funil */
.funil{display:flex;flex-direction:column;gap:6px}
.funil .et{display:grid;grid-template-columns:170px 1fr 56px;gap:12px;align-items:center;font-size:12.5px}
.funil .et .n{color:var(--tx-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.funil .et .b{height:22px;border-radius:6px;background:var(--barra-fundo);overflow:hidden}
.funil .et .b i{display:block;height:100%;background:linear-gradient(90deg,var(--serie-1),color-mix(in srgb,var(--serie-1) 70%,transparent));border-radius:6px;min-width:3px;transition:width .6s}
.funil .et .v{text-align:right;font-weight:600}

/* feed */
.feed{display:flex;flex-direction:column}
.feed .it{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:11px 0;border-bottom:1px solid var(--linha);align-items:start}
.feed .it:last-child{border-bottom:none}
.feed .it.clic{cursor:pointer}
.feed .it.clic:hover .tit{color:var(--marca)}
.feed .tit{font-weight:600;font-size:13px}
.feed .sub{color:var(--tx-3);font-size:12px}
.marcador{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--tx-3)}
.marcador.critico{background:var(--critico);box-shadow:0 0 0 4px var(--critico-bg)}
.marcador.alerta{background:var(--alerta);box-shadow:0 0 0 4px var(--alerta-bg)}
.marcador.ok{background:var(--ok)}

/* calendario de prazos */
.cal{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px}
.cal .d{border:1px solid var(--linha);border-radius:9px;padding:8px 6px;text-align:center;background:var(--sup-2);cursor:default;transition:transform .12s}
.cal .d:hover{transform:translateY(-2px)}
.cal .d .dw{font-size:10.5px;color:var(--tx-3)}
.cal .d .dn{font-size:13px;font-weight:600}
.cal .d .q{margin-top:6px;font:700 15px "JetBrains Mono",monospace;color:var(--tx-3)}
.cal .d.tem .q{color:var(--tx)}
.cal .d.critico{border-color:color-mix(in srgb,var(--critico) 50%,transparent);background:var(--critico-bg)}
.cal .d.critico .q{color:var(--critico)}
.cal .d.alerta{border-color:color-mix(in srgb,var(--alerta) 45%,transparent);background:var(--alerta-bg)}
.cal .d.alerta .q{color:var(--alerta)}
.cal .d.hoje{outline:2px solid var(--marca);outline-offset:1px}

/* anuncios */
.ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ad{border:1px solid var(--linha);border-radius:12px;overflow:hidden;background:var(--sup-2);display:flex;flex-direction:column}
.ad .img{aspect-ratio:1.6;background:var(--sup-3) center/cover no-repeat;position:relative}
.ad .img .rk{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;font:600 11px "JetBrains Mono",monospace;padding:3px 7px;border-radius:6px}
.ad .ct{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.ad .nm{font-weight:600;font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ad .cp{color:var(--tx-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad .mt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:auto;padding-top:6px;border-top:1px solid var(--linha)}
.ad .mt div{font-size:10.5px;color:var(--tx-3)}
.ad .mt b{display:block;font-size:12.5px;color:var(--tx)}
.ad a{font-size:12px;font-weight:600;color:var(--marca);text-decoration:none}

/* gaveta */
.veu{position:fixed;inset:0;background:rgba(5,6,8,.5);backdrop-filter:blur(2px);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.veu.on{opacity:1;pointer-events:auto}
.gaveta{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--sup);border-left:1px solid var(--linha);z-index:61;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.gaveta.on{transform:none}
.gaveta .gc{display:flex;align-items:flex-start;gap:12px;padding:20px 22px;border-bottom:1px solid var(--linha)}
.gaveta .gc h2{margin:0;font-size:16px}
.gaveta .gb{padding:18px 22px;overflow-y:auto;flex:1}
.gaveta .campos{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-bottom:18px}
.gaveta .campos div span{display:block;font-size:11.5px;color:var(--tx-3)}
.gaveta .campos div b{font-weight:600;font-size:13px}
.gaveta .texto{white-space:pre-wrap;font-size:13px;line-height:1.6;color:var(--tx-2);background:var(--sup-2);border:1px solid var(--linha);border-radius:10px;padding:14px;max-height:none}
.fechar{all:unset;cursor:pointer;margin-left:auto;padding:6px;border-radius:8px;color:var(--tx-2)}
.fechar:hover{background:var(--sup-3)}
.fechar svg{width:18px;height:18px;display:block}

.entra{animation:entra .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:1180px){.g-3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-21,.g-12{grid-template-columns:1fr}}
@media (max-width:860px){
  .app,.app.recolhida{grid-template-columns:minmax(0,1fr)}
  .topo .btn span,#b-modulo{display:none!important}
  .mini4{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  aside.side{position:fixed;left:0;top:0;bottom:0;width:256px;transform:translateX(-100%);transition:transform .25s}
  .app.mob-aberto aside.side{transform:none;box-shadow:0 0 60px rgba(0,0,0,.5)}
  .menu-mob{display:inline-flex}
  .topo{padding:12px 16px;gap:10px}
  .topo .sub,.relogio,.ao-vivo .txt{display:none}
  .conteudo{padding:16px 16px 48px}
  .g-2,.g-3{grid-template-columns:1fr}
  .cal{grid-template-columns:repeat(7,minmax(0,1fr))}
  .funil .et{grid-template-columns:110px 1fr 44px}
  .gaveta .campos{grid-template-columns:1fr}
  .busca{min-width:0;flex:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>

var GRAFS = [];  // {el, fn} re-render em resize

  return h;
};

/* =========================================================== gaveta (intimacao) */
function abrirIntim(id) {
  var it = intimLista().filter(function (x) { return String(x.id) === String(id); })[0];
  if (!it) return;
  var m = it.motor || {}, tri = it.triagem || {}, p = prazoDe(it), d = p ? diasAte(p) : null, conf = m.conferencia || {};
  var campos = [['Processo', '<span class="mono">' + esc(it.processo || '—') + '</span>'], ['Órgão', esc(orgaoDe(it) || '—')], ['Tribunal', esc(tribunalDe(it))], ['Disponibilizada', fmtData(it.data)], ['Chegou para nós', fmtData(it.visto_em)], ['Prazo', p ? fmtData(p) + ' ' + rotUrg(urgencia(it), d) : '—'],
    ['Ato (motor)', esc(m.ato || '—')], ['Responsável', esc(m.responsavel || '—')], ['Vencimento', fmtData(m.vencimento)], ['Fatal interno', fmtData(m.fatal_interno)], ['Categoria', esc(tri.categoria || '—')], ['Urgência', esc(tri.urgencia || '—')]];
  var g = $('#gaveta');
  g.innerHTML = '<div class="gc"><div><div style="color:var(--tx-3);font-size:12px">' + esc(it.tipo_comunicacao || 'Intimação') + '</div><h2>' + esc(m.ato || it.tipo_ato || it.tipo_comunicacao || 'Intimação') + '</h2></div><button class="fechar" id="g-fechar" aria-label="Fechar">' + ic('x') + '</button></div>' +
    '<div class="gb"><div class="campos">' + campos.map(function (c) { return '<div><span>' + c[0] + '</span><b>' + c[1] + '</b></div>'; }).join('') + '</div>' +
    (tri.acao || conf.providencia ? '<div class="aviso" style="margin-bottom:16px;background:var(--marca-suave);border-color:var(--marca-linha)">' + ic('alerta') + '<div><b>Providência sugerida</b><div>' + esc(conf.providencia || tri.acao) + '</div></div></div>' : '') +
    (it.resumo ? '<h3 style="font-size:13px;margin:0 0 8px">Resumo</h3><div class="texto" style="margin-bottom:16px">' + esc(it.resumo) + '</div>' : '') +
    (it.texto ? '<h3 style="font-size:13px;margin:0 0 8px">Inteiro teor</h3><div class="texto">' + esc(it.texto) + '</div>' : '') +
    '<div style="margin-top:18px"><a class="btn" href="/intimacoes" style="text-decoration:none">' + ic('link') + 'Abrir na Controladoria</a></div></div>';
  g.classList.add('on'); g.setAttribute('aria-hidden', 'false'); $('#veu').classList.add('on');
  $('#g-fechar').onclick = fecharGaveta; $('#g-fechar').focus();
}
function fecharGaveta() { $('#gaveta').classList.remove('on'); $('#gaveta').setAttribute('aria-hidden', 'true'); $('#veu').classList.remove('on'); }
$('#veu').onclick = fecharGaveta;

/* =========================================================== menu + render */
function contMenu(k) {
  var l = intimLista();
  if (k === 'intimacoes' && S.intim) { var cr = l.filter(function (i) { return urgencia(i) === 'critico'; }).length; return { n: (S.intim.total != null ? S.intim.total : l.length), q: cr > 0 }; }
  if (k === 'agenda' && S.tarefas) return { n: (S.tarefas.minhas || {}).atrasadas || 0, q: ((S.tarefas.minhas || {}).atrasadas || 0) > 0 };
  if (k === 'comercial' && S.crm) return { n: S.crm.nao_lidas, q: false };
  if (k === 'processos' && S.central && S.central.processos) return { n: S.central.processos.ativos, q: false };
  if (k === 'clientes' && S.central && S.central.clientes) return { n: S.central.clientes.total, q: false };
  if (k === 'financeiro' && S.fin && S.fin.receber_vencidas) return { n: S.fin.receber_vencidas.qtd, q: S.fin.receber_vencidas.qtd > 0 };
  return null;
}
function renderMenu() {
  $('#menu').innerHTML = SECOES.map(function (s, i) {
    var c = contMenu(s.k);
    return '<button class="' + (UI.secao === s.k ? 'on' : '') + '" data-ir="' + s.k + '" title="' + esc(s.t) + ' (' + (i < 9 ? i + 1 : '') + ')">' + ic(s.ic) + '<span class="rot">' + esc(s.t) + '</span>' +
      (c && c.n ? '<span class="cnt num' + (c.q ? ' quente' : '') + '">' + num(c.n) + '</span>' : (i < 9 ? '<kbd>' + (i + 1) + '</kbd>' : '')) + '</button>';
  }).join('');
}
var _ultimaSecao = null;
function render(forcarAnim) {
  var sec = SECOES.filter(function (s) { return s.k === UI.secao; })[0] || SECOES[0];
  $('#titulo').textContent = sec.t; $('#subtitulo').textContent = sec.sub;
  var rota = { intimacoes: '/intimacoes', processos: '/processos', clientes: '/contatos', comercial: '/comercial', marketing: '/campanhas', agenda: '/tarefas', financeiro: '/financeiro', equipe: '/rh', portal: '/resultado-portal', sistema: '/usuarios' }[sec.k];
  var bm = $('#b-modulo'); bm.style.display = rota ? '' : 'none'; if (rota) bm.href = rota;
  document.title = sec.t + ' · Central N&T';
  renderMenu();
  var ativo = document.activeElement, focoBusca = ativo && ativo.id === 'i-busca', pos = focoBusca ? ativo.selectionStart : 0;
  GRAFS = [];
  var el = $('#conteudo');
  el.innerHTML = R[sec.k]();
  if (!forcarAnim && _ultimaSecao === sec.k) el.querySelectorAll('.entra').forEach(function (x) { x.classList.remove('entra'); });
  _ultimaSecao = sec.k;
  GRAFS.forEach(function (gr) { var e = document.getElementById(gr.id); if (e) gr.fn(e); });
  if (focoBusca) { var ib = $('#i-busca'); if (ib) { ib.focus(); ib.setSelectionRange(pos, pos); } }
  /* status do sync no rodape */
  var st = S.ctrlStatus, pu = $('#sync-pulso'), tx = $('#sync-txt');
  if (st) { pu.className = 'pulso' + (st.conectado ? '' : ' off'); tx.textContent = st.conectado ? 'SYNC conectado' : 'SYNC desligado'; }
  if (ERR.intim && ERR.intim.status !== 403) { pu.className = 'pulso erro'; tx.textContent = 'SYNC com erro'; }
}
function redesenharGraficos() { GRAFS.forEach(function (gr) { var e = document.getElementById(gr.id); if (e) gr.fn(e); }); }

/* =========================================================== eventos */
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-ir],[data-intim],[data-ifiltro],[data-iordem],[data-funil],[data-ctab],[data-campper],[data-adsper],[data-finmes]');
  if (!t) return;
  if (t.dataset.ir) return irPara(t.dataset.ir);
  if (t.dataset.intim) return abrirIntim(t.dataset.intim);
  if (t.dataset.ifiltro) { UI.iFiltro = t.dataset.ifiltro; salvarUI(); return render(); }
  if (t.dataset.iordem) { UI.iOrdem = t.dataset.iordem; return render(); }
  if (t.dataset.funil != null) { UI.funil = +t.dataset.funil; return render(); }
  if (t.dataset.ctab) { UI.cTab = t.dataset.ctab; return render(); }
  if (t.dataset.campper) { UI.campPer = t.dataset.campper; salvarUI(); delete S.campDash; render(); return carregar('campDash'); }
  if (t.dataset.adsper) { UI.adsPer = t.dataset.adsper; salvarUI(); delete S.anuncios; render(); return carregar('anuncios'); }
  if (t.dataset.finmes != null) {
    var n = +t.dataset.finmes;
    if (n === 0) UI.finMes = hojeISO().slice(0, 7);
    else { var d = new Date(UI.finMes + '-15T00:00:00'); d.setMonth(d.getMonth() + n); UI.finMes = isoDe(d).slice(0, 7); }
    delete S.fin; render(); return carregar('fin');
  }
});
document.addEventListener('keydown', function (ev) {
  if (ev.target.closest && ev.target.closest('[data-ir][role=button]') && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); return irPara(ev.target.dataset.ir); }
  var digitando = /INPUT|TEXTAREA|SELECT/.test((ev.target.tagName || ''));
  if (ev.key === 'Escape') { if (digitando) ev.target.blur(); return fecharGaveta(); }
  if (digitando || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (/^[1-9]$/.test(ev.key) && SECOES[+ev.key - 1]) return irPara(SECOES[+ev.key - 1].k);
  if (ev.key === 'r' || ev.key === 'R') return carregarTudo(2);
  if (ev.key === '[') return $('#b-recolher').click();
  if (ev.key === '/') { if (UI.secao !== 'intimacoes') irPara('intimacoes'); ev.preventDefault(); var ib = $('#i-busca'); if (ib) ib.focus(); }
});
var _bt = 0;
document.addEventListener('input', function (ev) {
  if (ev.target.id === 'i-busca') { UI.iBusca = ev.target.value; clearTimeout(_bt); _bt = setTimeout(render, 160); }
});
/* hover no calendario de prazos */
document.addEventListener('mousemove', function (ev) {
  var d = ev.target.closest && ev.target.closest('.cal .d');
  if (!d) { if (tip.dataset.cal) { delete tip.dataset.cal; esconderTip(); } return; }
  var iso = d.dataset.dia, l = prazosProximos().filter(function (p) { return p.data === iso; });
  tip.dataset.cal = 1;
  mostrarTip('<b>' + fmtData(iso) + ' · ' + l.length + ' prazo(s)</b>' + (l.length ? l.slice(0, 8).map(function (p) { return '<div style="margin-top:4px"><div style="font-weight:600;color:var(--tx)">' + esc(p.titulo) + '</div><div class="mono" style="font-size:11px;color:var(--tx-3)">' + esc(p.processo || '') + (p.resp ? ' · ' + esc(p.resp) : '') + '</div></div>'; }).join('') + (l.length > 8 ? '<div style="color:var(--tx-3);margin-top:4px">+' + (l.length - 8) + '…</div>' : '') : '<div style="color:var(--tx-3)">Livre.</div>'), ev.clientX, ev.clientY);
});
$('#b-atualizar').onclick = function () { carregarTudo(2); };
$('#b-mob').onclick = function () { $('#app').classList.toggle('mob-aberto'); };
$('#b-sistema').onclick = function () { location.href = '/'; };
$('#b-recolher').onclick = function () {
  var a = $('#app'); a.classList.toggle('recolhida');
  try { localStorage.setItem('central_recolhida', a.classList.contains('recolhida') ? '1' : ''); } catch (e) {}
  setTimeout(redesenharGraficos, 60);
};
try { if (localStorage.getItem('central_recolhida')) $('#app').classList.add('recolhida'); } catch (e) {}
$('#b-tema').onclick = function () {
  var r = document.documentElement, escuroAgora = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = escuroAgora ? 'light' : 'dark';
  try { localStorage.setItem('central_tema', r.dataset.theme); } catch (e) {}
  desenharLogo(); render();
};
try { var tm = localStorage.getItem('central_tema'); if (tm) document.documentElement.dataset.theme = tm; } catch (e) {}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { desenharLogo(); render(); });
window.addEventListener('hashchange', function () { var k = location.hash.slice(1); if (k && k !== UI.secao) irPara(k); });
var _rz = 0; window.addEventListener('resize', function () { clearTimeout(_rz); _rz = setTimeout(redesenharGraficos, 120); });

/* =========================================================== logo (timbrado) */
/* O PNG do timbrado tem fundo branco e nome em cinza. A barra lateral e escura,
   entao a imagem e redesenhada: fundo vira transparente, o vermelho fica
   vermelho e o cinza do nome vira cinza claro. Os vazados do simbolo deixam
   aparecer o fundo, como numa versao negativa da marca. */
var LOGO = new Image(); LOGO.src = '/logo-nt.png';
LOGO.onload = desenharLogo;
function desenharLogo() {
  if (!LOGO.complete || !LOGO.naturalWidth) return;
  var cv = $('#logo'), cx = cv.getContext('2d');
  var W = LOGO.naturalWidth, H = LOGO.naturalHeight, K = 2;
  cv.width = W * K; cv.height = H * K;
  cx.imageSmoothingQuality = 'high';
  cx.drawImage(LOGO, 0, 0, W * K, H * K);
  var img = cx.getImageData(0, 0, cv.width, cv.height), p = img.data;
  for (var i = 0; i < p.length; i += 4) {
    var r = p[i], g = p[i + 1], b = p[i + 2], a = p[i + 3] / 255;
    var verm = r - Math.max(g, b);
    if (verm > 40) {            // vermelho da marca (com borda suavizada)
      var tinta = Math.min(1, (255 - g) / (255 - 20));
      p[i] = 0xE0; p[i + 1] = 0x26; p[i + 2] = 0x2E; p[i + 3] = 255 * a * tinta;
    } else {                    // cinza do nome ou fundo branco
      var lum = (r + g + b) / 3, t2 = Math.max(0, Math.min(1, (250 - lum) / (250 - 130)));
      p[i] = 0xD5; p[i + 1] = 0xDB; p[i + 2] = 0xE2; p[i + 3] = 255 * a * t2;
    }
  }
  cx.putImageData(img, 0, 0);
  /* simbolo isolado para o menu recolhido: recorta os primeiros ~48px */
  var sv = $('#simbolo'), sx = sv.getContext('2d');
  sv.width = 50 * K; sv.height = 50 * K; sx.clearRect(0, 0, sv.width, sv.height);
  sx.drawImage(cv, 0, 0, 50 * K, 50 * K, 0, 0, 50 * K, 50 * K);
}

/* =========================================================== partida */
setInterval(function () { $('#relogio').textContent = new Date().toLocaleTimeString('pt-BR'); }, 1000);
$('#relogio').textContent = new Date().toLocaleTimeString('pt-BR');
var hk = location.hash.slice(1); if (hk) UI.secao = hk;
irPara(UI.secao);
carregar('me').then(function () {
  var u = S.me || {}; var nome = u.nome || u.email || '—';
  $('#u-nome').textContent = nome; $('#u-papel').textContent = u.papel || '';
  $('#avatar').textContent = nome.split(/\s+/).filter(Boolean).slice(0, 2).map(function (x) { return x[0]; }).join('').toUpperCase() || '·';
});
carregar('ctrlStatus');
carregarTudo(2);
/* ciclo 1 (banco local e SYNC em cache): 2 min. ciclo 2 (Meta Ads, mais lento): 5 min. */
setInterval(function () { if (!document.hidden) carregarTudo(1); }, 120000);
setInterval(function () { if (!document.hidden) { ['visao', 'anuncios', 'campDash'].forEach(carregar); } }, 300000);
})();
</script>
